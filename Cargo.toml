[package]
name = "android-group-control-rs"
version = "0.1.0"
edition = "2024"
default-run = "web"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
image = "0.25.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.6.6", features = ["cors"] }
futures = "0.3"
rand = "0.8"
